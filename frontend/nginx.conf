server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fotos de clientes têm até 2 MB (limite do Spring); folga para o multipart
    client_max_body_size 5m;

    # Mesmo contrato do proxy do Vite: /api/* -> backend sem o prefixo
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Assets com hash no nome podem ficar em cache por muito tempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota desconhecida cai no index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
